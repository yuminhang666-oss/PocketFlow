<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PocketFlow · UI 设计样稿</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#e7ece7;color:#202d27;font:14px/1.5 'Microsoft YaHei','Noto Sans SC',sans-serif}h1{font-size:28px;margin:0 0 6px;letter-spacing:-.6px}p{margin:0}.intro{color:#52645a;margin-bottom:28px}.board{display:grid;grid-template-columns:repeat(4,360px);gap:24px}.label{font-weight:600;margin-bottom:12px}.phone{--bg:#f5f6f2;--surface:#fff;--ink:#202d27;--muted:#64736b;--primary:#2e6b58;--soft:#e7eee5;--hero:#153e35;width:360px;height:800px;background:var(--bg);color:var(--ink);border-radius:28px;overflow:hidden;position:relative;border:1px solid #c4cec5;display:flex;flex-direction:column}.dark{--bg:#101a16;--surface:#192620;--ink:#edf3ee;--muted:#a7b7ad;--primary:#9bcbb5;--soft:#243c31;--hero:#1f493c;border-color:#334b3c}.status{height:32px;padding:9px 24px;font-size:10px;display:flex;justify-content:space-between}.header{padding:18px 20px 16px;font-size:21px;font-weight:600;display:flex;align-items:center;justify-content:space-between}.month{font-size:12px;font-weight:400;color:var(--muted)}.content{padding:0 20px;flex:1}.hero{background:var(--hero);color:#f6faf4;border-radius:24px;padding:24px 20px}.eyebrow{font-size:13px}.big{font-family:Arial,sans-serif;font-variant-numeric:tabular-nums;font-weight:600;font-size:51px;letter-spacing:-1.5px;margin:10px 0 2px}.big small{font-family:'Microsoft YaHei',sans-serif;font-size:14px;font-weight:400;letter-spacing:0}.caption{font-size:11px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #4c6f60;padding-top:18px;margin-top:20px}.metrics span{display:block;font-size:11px;margin-bottom:6px}.metrics b{font:600 14px Arial,sans-serif}.track{margin-top:20px;height:5px;border-radius:4px;background:#4c6f60;overflow:hidden}.fill{height:100%;background:#d6e4a7;width:40%}.percentage{font-size:11px;margin-top:8px}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 6px;font-size:17px;font-weight:600}.link{font-size:12px;color:var(--primary);font-weight:400}.tx{display:flex;gap:12px;padding:16px 0;align-items:center}.badge{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-size:15px}.txinfo{flex:1}.txinfo strong{font-size:14px;font-weight:500}.txinfo p{color:var(--muted);font-size:11px;margin-top:4px}.tx>b{font:600 15px Arial,sans-serif}.fab{position:absolute;right:20px;bottom:100px;background:var(--primary);color:var(--surface);border-radius:17px;padding:16px 20px;font-size:14px}.dark .fab{color:#10291f}.nav{height:82px;display:flex;justify-content:space-around;align-items:center;background:var(--surface);font-size:11px;color:var(--muted);padding-bottom:8px}.nav div{text-align:center;width:92px}.nav i{display:block;font-style:normal;font-size:21px;margin-bottom:4px}.nav .active{color:var(--primary)}.nav .active i{border-radius:20px;background:var(--soft);width:64px;margin:0 auto 4px}.entry .header{justify-content:flex-start;gap:18px}.amountlabel{margin-top:12px;color:var(--muted);font-size:13px}.entry .big{color:var(--ink);margin-top:8px;margin-bottom:24px}.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.category{border:1px solid #b5c4ba;text-align:center;border-radius:12px;padding:9px 0;font-size:12px;min-height:64px}.category i{display:block;font-size:18px;font-style:normal;margin-bottom:3px}.category.selected{background:var(--soft);border-color:var(--primary);color:var(--primary)}.metadata{display:flex;justify-content:space-between;padding:17px 0;border-bottom:1px solid #dce3dc}.metadata small{color:var(--muted);font-size:12px}.keyarea{margin-top:25px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.key{height:53px;background:var(--surface);border-radius:12px;display:grid;place-items:center;font:23px Arial,sans-serif}.save{margin-top:12px;background:var(--primary);color:#fff;text-align:center;border-radius:16px;padding:17px;font-size:14px;font-weight:600}.homebar{width:110px;height:4px;border-radius:4px;background:var(--ink);opacity:.3;margin:14px auto 12px}.over .fill{width:100%}.notice{margin-top:14px;font-size:12px}.empty{margin-top:50px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);font-size:17px;margin:12px}.footnote{margin-top:24px;font-size:12px;color:#52645a;max-width:1100px}.over .big{font-size:48px}@media(max-width:1570px){.board{grid-template-columns:repeat(2,360px)}}@media(max-width:800px){body{padding:20px}.board{grid-template-columns:360px}}
.entry .header{padding:12px 20px}.entry .amountlabel{margin-top:8px}.entry .big{margin-bottom:16px}.entry .metadata{padding:12px 0}.entry .keyarea{margin-top:16px}.entry .key{height:48px}.entry .homebar{margin:12px auto}
</style>
<h1>PocketFlow <span style="font-size:16px;font-weight:400;margin-left:12px">把生活费，安排得刚刚好</span></h1>
<p class="intro">首页与快速记账 · 森林绿 / 中文 Material 3 / 轻量列表　　示例数据 · 设计样稿，非 Flutter 运行截图</p>
<div class="board" id="board"></div>
<p class="footnote">界面重点：每日可支配额度、完整预算信息、单手记账。超支同时显示文字与提示图标；浅深色共享信息层级。真实 Flutter 的大字体、键盘安全区、保存与读屏测试仍待工具链和设备验证。</p>
<script>
const status='<div class="status"><span>9:41</span><span>●●●　5G　▰</span></div>';
const nav='<div class="nav"><div class="active"><i>⌂</i>首页</div><div><i>▥</i>统计</div><div><i>⚙</i>设置</div></div>';
function metrics(over){return `<div class="metrics"><div><span>本月预算</span><b>¥${over?'500':'1,500'}.00</b></div><div><span>本月已支出</span><b>¥600.00</b></div><div><span>${over?'已超支':'剩余预算'}</span><b>¥${over?'100':'900'}.00</b></div></div><div class="track"><div class="fill"></div></div><div class="percentage">预算已用 ${over?'120':'40'}%</div>`}
function home(dark,over){return `<div class="phone ${dark?'dark':''} ${over?'over':''}">${status}<div class="header">PocketFlow <span class="month">2026年10月 ▾</span></div><div class="content"><div class="hero"><div class="eyebrow">从今天起 · 每日可支配</div><div class="big">¥ ${over?'0':'60'}.00 <small>/ 天</small></div><div class="caption">包含今天，距离月底还有 15 天</div>${metrics(over)}${over?'<div class="notice">ⓘ　本月已超支，仍可如实记录消费</div>':''}</div><div class="section">最近消费<span class="link">查看全部</span></div>${[['餐','食堂午餐','餐饮','18'],['饮','一杯拿铁','饮品','12'],['行','地铁出行','交通','8']].map(([icon,title,cat,money])=>`<div class="tx"><div class="badge">${icon}</div><div class="txinfo"><strong>${title}</strong><p>${cat} · 2026-10-17</p></div><b>−¥${money}.00</b></div>`).join('')}</div><div class="fab">＋　记一笔</div>${nav}</div>`}
function editor(){return `<div class="phone entry">${status}<div class="header"><span>‹</span>记一笔</div><div class="content"><div class="amountlabel">支出金额</div><div class="big">¥ 18.00</div><div class="categories">${[['✓','餐饮'],['♧','饮品'],['▱','购物'],['⇄','交通'],['▤','学习'],['♧','娱乐'],['＋','医疗'],['···','其他']].map(([icon,c],i)=>`<div class="category ${i===0?'selected':''}"><i>${icon}</i>${c}</div>`).join('')}</div><div class="metadata"><span>日期</span><small>2026-10-17　›</small></div><div class="metadata"><span>备注</span><small>添加备注（选填）　›</small></div><div class="keyarea"><div class="keypad">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(n=>`<div class="key">${n}</div>`).join('')}</div><div class="save">保存支出</div></div></div><div class="homebar"></div></div>`}
document.getElementById('board').innerHTML=[['首页 · 浅色',home(false,false)],['首页 · 深色',home(true,false)],['快速记账 · 默认餐饮',editor()],['首页 · 超支状态',home(false,true)]].map(([label,phone])=>`<section><div class="label">${label}</div>${phone}</section>`).join('');
</script>
</html>
