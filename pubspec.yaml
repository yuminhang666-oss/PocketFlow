name: pocketflow
description: Offline living-expense budgeting for university students.
publish_to: none
version: 0.3.2+8

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  drift: 2.35.2
  drift_flutter: 0.3.1
  fl_chart: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.2

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/app_zh_Hans.arb
    - lib/l10n/app_zh_Hant.arb
    - lib/l10n/app_en.arb
